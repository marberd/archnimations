<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="cedarS" patternUnits="userSpaceOnUse" width="10" height="40">
      <rect width="10" height="40" fill="#161616"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#0a0a0a" stroke-width="1"/>
    </pattern>
    <pattern id="poche2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#101218" stroke-width="1.1"/>
    </pattern>
    <pattern id="copperS" patternUnits="userSpaceOnUse" width="22" height="12">
      <rect width="22" height="12" fill="#7C3A20"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3B1A0D" stroke-width="1.3"/>
    </pattern>
    <pattern id="concreteS" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#CFC8B6"/>
      <circle cx="3" cy="4" r="0.7" fill="#7d745f"/>
      <circle cx="11" cy="9" r="0.8" fill="#7d745f"/>
    </pattern>
    <pattern id="oakFloor" patternUnits="userSpaceOnUse" width="60" height="10">
      <rect width="60" height="10" fill="#E0CDA3"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a18757" stroke-width="0.6"/>
      <line x1="60" y1="0" x2="60" y2="10" stroke="#a18757" stroke-width="0.6"/>
    </pattern>
    <marker id="dim-tickS" viewBox="-1 -6 2 12" markerWidth="2" markerHeight="12" orient="auto">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#101218" stroke-width="1.5"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,2 L9,5 L0,8 z" fill="#101218"/>
    </marker>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cad4d7"/>
      <stop offset="100%" stop-color="#7d959c"/>
    </linearGradient>
    <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6E1D6"/>
      <stop offset="100%" stop-color="#F5F2EB"/>
    </linearGradient>
  </defs>

  <!-- Sheet -->
  <rect width="1600" height="1200" fill="#F5F2EB"/>
  <rect x="40" y="40" width="1520" height="1120" fill="none" stroke="#101218" stroke-width="2"/>
  <rect x="52" y="52" width="1496" height="1096" fill="none" stroke="#101218" stroke-width="0.6"/>

  <text x="80" y="100" fill="#101218" font-size="14" letter-spacing="6">ARCHNIMATIONS  /  RESIDENTIAL  /  MAREA MICRO-HOUSE  /  LAS GALERAS, SAMANÁ</text>
  <line x1="80" y1="115" x2="1520" y2="115" stroke="#101218" stroke-width="0.6"/>
  <text x="80" y="160" fill="#101218" font-size="34" font-weight="600" letter-spacing="2">SECTION A — A</text>
  <text x="80" y="186" fill="#5b5a55" font-size="14" letter-spacing="3">SCALE 1:50  /  LONGITUDINAL CUT, LOOKING WEST  /  THROUGH LIVING + BATH POD</text>

  <!--
    Section cuts north-to-south through living area and bath pod beneath mezzanine.
    Section width = house length 5000 mm = 700 px at 1m=140 px.
    Place cut at center: house base from x=420 to x=1120, FFL at y=820.
    Ceiling slopes: north (left in this view) eave higher = 4200 mm, south eave = 2800 mm.
  -->

  <!-- Sky / horizon -->
  <rect x="80" y="240" width="1440" height="600" fill="url(#skyS)"/>
  <rect x="80" y="640" width="430" height="200" fill="url(#oceanGrad)"/>
  <line x1="80" y1="640" x2="510" y2="640" stroke="#5b6e74" stroke-width="0.6"/>
  <!-- Ocean waves -->
  <g stroke="#5b6e74" stroke-width="0.4" fill="none" opacity="0.6">
    <path d="M 90 680 q 20 -6 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    <path d="M 90 720 q 20 -6 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    <path d="M 90 760 q 20 -6 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    <path d="M 90 800 q 20 -6 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
  </g>
  <text x="100" y="660" fill="#5b6e74" font-size="11" letter-spacing="4">ATLANTIC OCEAN</text>

  <!-- Sun lower right above horizon (warm dusk) -->
  <circle cx="320" cy="600" r="30" fill="#E8B27A" opacity="0.7"/>

  <g transform="translate(420,820)">
    <!-- Grade line -->
    <line x1="-420" y1="0" x2="1100" y2="0" stroke="#101218" stroke-width="1.6"/>
    <!-- Earth fill under podium -->
    <g stroke="#5b5a55" stroke-width="0.5" fill="none">
      <line x1="-420" y1="0" x2="-405" y2="14"/>
      <line x1="-380" y1="0" x2="-365" y2="14"/>
      <line x1="-340" y1="0" x2="-325" y2="14"/>
      <line x1="-300" y1="0" x2="-285" y2="14"/>
      <line x1="-260" y1="0" x2="-245" y2="14"/>
      <line x1="-220" y1="0" x2="-205" y2="14"/>
      <line x1="-180" y1="0" x2="-165" y2="14"/>
      <line x1="-140" y1="0" x2="-125" y2="14"/>
      <line x1="-100" y1="0" x2="-85" y2="14"/>
      <line x1="-60" y1="0" x2="-45" y2="14"/>
      <line x1="-20" y1="0" x2="-5" y2="14"/>
      <line x1="780" y1="0" x2="795" y2="14"/>
      <line x1="820" y1="0" x2="835" y2="14"/>
      <line x1="860" y1="0" x2="875" y2="14"/>
      <line x1="900" y1="0" x2="915" y2="14"/>
      <line x1="940" y1="0" x2="955" y2="14"/>
      <line x1="980" y1="0" x2="995" y2="14"/>
      <line x1="1020" y1="0" x2="1035" y2="14"/>
      <line x1="1060" y1="0" x2="1075" y2="14"/>
    </g>

    <!-- Cliff face (left/north side) -->
    <path d="M 0 0 L 0 240 L -40 220 L -60 240 L -80 200 L -120 240 L -180 230 L -260 240 L -340 220 L -420 240 L -420 240" fill="none" stroke="#5b5a55" stroke-width="0.6" stroke-dasharray="3 3"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#101218" stroke-width="0.6" stroke-dasharray="4 4"/>

    <!-- Concrete podium cut (poché) -->
    <rect x="-120" y="-84" width="900" height="84" fill="url(#concreteS)" stroke="#101218" stroke-width="1.4"/>
    <path d="M -120 -84 H 780 V 0 H -120 Z" fill="url(#poche2)" opacity="0.4"/>
    <text x="330" y="-30" font-size="11" fill="#101218" text-anchor="middle" letter-spacing="3">REINFORCED CONCRETE PODIUM</text>

    <!-- Oak floor finish on top of podium -->
    <rect x="0" y="-92" width="700" height="8" fill="url(#oakFloor)" stroke="#101218" stroke-width="0.4"/>

    <!-- North wall cut (left of section) — full-height glazing. North wall sits at x=0 (cliff side). -->
    <!-- North wall actually is glazing. Show frame and sloped roof beam connection. -->
    <rect x="-14" y="-588" width="14" height="504" fill="url(#cedarS)" stroke="#0a0a0a" stroke-width="1"/>
    <!-- Glazing from FFL to high eave -->
    <rect x="0" y="-588" width="14" height="504" fill="#A9C2D1" opacity="0.55" stroke="#0a0a0a" stroke-width="0.8"/>
    <!-- Mullion dividers -->
    <g stroke="#0a0a0a" stroke-width="0.6">
      <line x1="0" y1="-490" x2="14" y2="-490"/>
      <line x1="0" y1="-380" x2="14" y2="-380"/>
      <line x1="0" y1="-220" x2="14" y2="-220"/>
    </g>

    <!-- South wall cut (right of section) - cedar -->
    <rect x="700" y="-392" width="14" height="308" fill="url(#cedarS)" stroke="#0a0a0a" stroke-width="1.3"/>
    <!-- Wall poché for both vertical walls -->
    <rect x="-14" y="-588" width="14" height="504" fill="url(#poche2)" opacity="0.4"/>
    <rect x="700" y="-392" width="14" height="308" fill="url(#poche2)" opacity="0.4"/>

    <!-- Roof cut. Going from (0,-588) high north eave to (700,-392) low south eave. Roof thickness 220mm=30px. -->
    <polygon points="-54,-596 700,-372 700,-340 -54,-562" fill="url(#copperS)" stroke="#0a0a0a" stroke-width="1.3"/>
    <!-- Insulation (squiggle) inside roof -->
    <path d="M -30 -578 q 10 -8 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0"
          stroke="#7d745f" stroke-width="0.7" fill="none" opacity="0.6"/>
    <!-- Roof overhang notation north -->
    <line x1="-54" y1="-596" x2="-54" y2="0" stroke="#101218" stroke-width="0.4" stroke-dasharray="3 3"/>

    <!-- Mezzanine deck (above bath pod, south end). Mezz floor at y = -84-210 = -294 -->
    <rect x="450" y="-302" width="250" height="14" fill="#E0CDA3" stroke="#101218" stroke-width="1"/>
    <rect x="450" y="-300" width="250" height="6" fill="url(#oakFloor)"/>
    <text x="575" y="-270" font-size="11" fill="#101218" text-anchor="middle" letter-spacing="3">MEZZANINE  ·  SLEEPING LOFT</text>
    <text x="575" y="-256" font-size="9" fill="#5b5a55" text-anchor="middle" letter-spacing="2">+2.40 FFL  ·  1.50 m head clearance at apex</text>

    <!-- Bed silhouette on mezz -->
    <rect x="490" y="-302" width="170" height="-44" fill="none"/>
    <rect x="490" y="-340" width="170" height="40" rx="4" fill="#E6DEC6" stroke="#101218" stroke-width="0.9"/>
    <rect x="490" y="-340" width="170" height="10" rx="2" fill="#D9CFB4" stroke="#101218" stroke-width="0.4"/>
    <text x="575" y="-318" font-size="9" fill="#101218" text-anchor="middle" letter-spacing="3">BED 1500 × 2000</text>

    <!-- Bath pod under mezz (cut shows shower wall) -->
    <rect x="450" y="-84" width="14" height="218" fill="#101218" transform="translate(0,-218)"/>
    <rect x="450" y="-302" width="14" height="218" fill="#101218"/>
    <text x="575" y="-200" font-size="11" fill="#101218" text-anchor="middle" letter-spacing="3">BATH POD</text>
    <text x="575" y="-184" font-size="9" fill="#5b5a55" text-anchor="middle" letter-spacing="2">tiled stone — micro-cement</text>
    <!-- WC silhouette inside pod -->
    <g transform="translate(490,-130)" stroke="#101218" stroke-width="0.8" fill="none">
      <rect x="0" y="0" width="34" height="22" rx="3"/>
      <ellipse cx="17" cy="36" rx="14" ry="12"/>
    </g>
    <!-- Shower head -->
    <line x1="660" y1="-280" x2="660" y2="-220" stroke="#101218" stroke-width="0.8"/>
    <ellipse cx="660" cy="-220" rx="10" ry="2" fill="none" stroke="#101218" stroke-width="0.8"/>
    <g stroke="#A9C2D1" stroke-width="0.5">
      <line x1="652" y1="-218" x2="652" y2="-160"/>
      <line x1="656" y1="-218" x2="656" y2="-160"/>
      <line x1="660" y1="-218" x2="660" y2="-160"/>
      <line x1="664" y1="-218" x2="664" y2="-160"/>
      <line x1="668" y1="-218" x2="668" y2="-160"/>
    </g>

    <!-- Ladder to mezzanine cut: at south-center of plan, but section shows it next to bath -->
    <g stroke="#101218" stroke-width="0.9">
      <line x1="408" y1="-302" x2="408" y2="-84"/>
      <line x1="430" y1="-302" x2="430" y2="-84"/>
      <line x1="408" y1="-264" x2="430" y2="-264"/>
      <line x1="408" y1="-228" x2="430" y2="-228"/>
      <line x1="408" y1="-192" x2="430" y2="-192"/>
      <line x1="408" y1="-156" x2="430" y2="-156"/>
      <line x1="408" y1="-120" x2="430" y2="-120"/>
    </g>
    <text x="396" y="-160" font-size="9" fill="#5b5a55" text-anchor="end" letter-spacing="1">steel ladder</text>

    <!-- Living area furniture in section -->
    <!-- Sofa daybed -->
    <rect x="80" y="-128" width="280" height="44" rx="4" fill="#E6DEC6" stroke="#101218" stroke-width="0.9"/>
    <rect x="80" y="-128" width="280" height="14" rx="3" fill="#D9CFB4" stroke="#101218" stroke-width="0.5"/>
    <text x="220" y="-95" font-size="9" fill="#101218" text-anchor="middle" letter-spacing="3">DAYBED · SOFA</text>

    <!-- Wood stove + flue -->
    <rect x="330" y="-180" width="40" height="96" rx="6" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="345" y="-580" width="10" height="400" fill="#1a1a1a"/>
    <ellipse cx="350" cy="-150" rx="14" ry="6" fill="#F39C42" opacity="0.5"/>
    <text x="350" y="-184" font-size="8" fill="#5b5a55" text-anchor="middle" letter-spacing="2">WOOD STOVE</text>

    <!-- Human figure for scale (in living area) — 1.75m -->
    <g transform="translate(180,-84)">
      <circle cx="0" cy="-235" r="11" fill="#2a2a2a"/>
      <line x1="0" y1="-224" x2="0" y2="-130" stroke="#2a2a2a" stroke-width="9"/>
      <line x1="0" y1="-200" x2="-18" y2="-150" stroke="#2a2a2a" stroke-width="5"/>
      <line x1="0" y1="-200" x2="18" y2="-160" stroke="#2a2a2a" stroke-width="5"/>
      <line x1="0" y1="-130" x2="-12" y2="-2" stroke="#2a2a2a" stroke-width="6"/>
      <line x1="0" y1="-130" x2="14" y2="-2" stroke="#2a2a2a" stroke-width="6"/>
    </g>

    <!-- Levels right side -->
    <g stroke="#101218" stroke-width="0.6" fill="#101218">
      <line x1="780" y1="0" x2="900" y2="0" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="780" y1="-84" x2="900" y2="-84" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="780" y1="-294" x2="900" y2="-294" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="780" y1="-392" x2="900" y2="-392" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="780" y1="-588" x2="900" y2="-588" stroke-dasharray="2 3" stroke-width="0.4"/>

      <text x="908" y="3" font-size="10" letter-spacing="2">± 0.00 GRADE</text>
      <text x="908" y="-81" font-size="10" letter-spacing="2">+ 0.60 FFL</text>
      <text x="908" y="-291" font-size="10" letter-spacing="2">+ 2.10 MEZZ DECK</text>
      <text x="908" y="-389" font-size="10" letter-spacing="2">+ 2.80 EAVE S</text>
      <text x="908" y="-585" font-size="10" letter-spacing="2">+ 4.20 EAVE N</text>
    </g>

    <!-- Horizontal dim -->
    <g stroke="#101218" stroke-width="0.7" fill="#101218">
      <line x1="0" y1="44" x2="700" y2="44" marker-start="url(#dim-tickS)" marker-end="url(#dim-tickS)"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="700" y1="0" x2="700" y2="50" stroke-dasharray="2 3" stroke-width="0.4"/>
      <text x="350" y="62" font-size="13" text-anchor="middle" letter-spacing="2">5 000</text>
    </g>
  </g>

  <!-- View direction arrow (top-left) -->
  <g transform="translate(120,300)">
    <text font-size="10" letter-spacing="3" fill="#5b5a55">LOOKING WEST  →</text>
    <line x1="0" y1="14" x2="100" y2="14" stroke="#101218" stroke-width="0.8" marker-end="url(#arrowS)"/>
    <text y="36" font-size="9" fill="#5b5a55" letter-spacing="2">section cut through living + bath pod</text>
  </g>

  <!-- Title block -->
  <g transform="translate(1110,950)">
    <rect x="0" y="0" width="410" height="170" fill="none" stroke="#101218" stroke-width="1"/>
    <line x1="0" y1="34" x2="410" y2="34" stroke="#101218" stroke-width="0.6"/>
    <line x1="0" y1="100" x2="410" y2="100" stroke="#101218" stroke-width="0.6"/>
    <line x1="200" y1="34" x2="200" y2="170" stroke="#101218" stroke-width="0.6"/>
    <text x="14" y="22" font-size="14" letter-spacing="4" fill="#101218">ARCHNIMATIONS</text>
    <text x="14" y="56" font-size="10" letter-spacing="2" fill="#5b5a55">PROJECT</text>
    <text x="14" y="76" font-size="13" letter-spacing="2" fill="#101218">MAREA MICRO-HOUSE</text>
    <text x="14" y="90" font-size="10" letter-spacing="1" fill="#5b5a55">Las Galeras · Samaná</text>
    <text x="14" y="122" font-size="10" letter-spacing="2" fill="#5b5a55">DRAWING</text>
    <text x="14" y="138" font-size="12" letter-spacing="2" fill="#101218">A-301  SECTION A — A</text>
    <text x="14" y="154" font-size="9" letter-spacing="1" fill="#5b5a55">Scale 1:50  ·  Sheet 3 / 3</text>
    <text x="214" y="56" font-size="10" letter-spacing="2" fill="#5b5a55">DATE</text>
    <text x="214" y="74" font-size="11" letter-spacing="1" fill="#101218">2026 · 06</text>
    <text x="214" y="122" font-size="10" letter-spacing="2" fill="#5b5a55">CUT</text>
    <text x="214" y="138" font-size="11" letter-spacing="1" fill="#101218">Longitudinal N–S</text>
    <text x="214" y="154" font-size="9" letter-spacing="1" fill="#5b5a55">Through living + bath pod + mezzanine</text>
  </g>
</svg>
