<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="cedar" patternUnits="userSpaceOnUse" width="10" height="40">
      <rect width="10" height="40" fill="#161616"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#0a0a0a" stroke-width="1.2"/>
      <line x1="10" y1="0" x2="10" y2="40" stroke="#2a2a2a" stroke-width="0.6"/>
    </pattern>
    <pattern id="copperRoof" patternUnits="userSpaceOnUse" width="22" height="12">
      <rect width="22" height="12" fill="#7C3A20"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3B1A0D" stroke-width="1.3"/>
      <line x1="22" y1="0" x2="22" y2="12" stroke="#3B1A0D" stroke-width="1.3"/>
    </pattern>
    <pattern id="concretePod" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#CFC8B6"/>
      <circle cx="3" cy="4" r="0.7" fill="#7d745f"/>
      <circle cx="9" cy="2" r="0.5" fill="#7d745f"/>
      <circle cx="11" cy="9" r="0.8" fill="#7d745f"/>
      <circle cx="5" cy="11" r="0.5" fill="#7d745f"/>
    </pattern>
    <pattern id="cortenP" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect width="30" height="30" fill="#7F3A1E"/>
      <circle cx="6" cy="8" r="1" fill="#a85630"/>
      <circle cx="20" cy="14" r="1.2" fill="#5e2510"/>
      <circle cx="10" cy="22" r="0.9" fill="#a85630"/>
      <circle cx="24" cy="25" r="0.8" fill="#5e2510"/>
    </pattern>
    <marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,2 L9,5 L0,8 z" fill="#101218"/>
    </marker>
    <marker id="dim-tickE" viewBox="-1 -6 2 12" markerWidth="2" markerHeight="12" orient="auto">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#101218" stroke-width="1.5"/>
    </marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6E1D6"/>
      <stop offset="100%" stop-color="#F5F2EB"/>
    </linearGradient>
  </defs>

  <!-- Sheet -->
  <rect width="1600" height="1200" fill="#F5F2EB"/>
  <rect x="40" y="40" width="1520" height="1120" fill="none" stroke="#101218" stroke-width="2"/>
  <rect x="52" y="52" width="1496" height="1096" fill="none" stroke="#101218" stroke-width="0.6"/>

  <text x="80" y="100" fill="#101218" font-size="14" letter-spacing="6">ARCHNIMATIONS  /  RESIDENTIAL  /  MAREA MICRO-HOUSE  /  LAS GALERAS, SAMANÁ</text>
  <line x1="80" y1="115" x2="1520" y2="115" stroke="#101218" stroke-width="0.6"/>
  <text x="80" y="160" fill="#101218" font-size="34" font-weight="600" letter-spacing="2">EAST ELEVATION</text>
  <text x="80" y="186" fill="#5b5a55" font-size="14" letter-spacing="3">SCALE 1:50  /  OCEAN-FACING FACADE</text>

  <!--
    Scale: 1m = 140 px
    House footprint depth (east elevation shows the 4 m depth + roof slope)
    Drawing: east face = depth 4000mm (560 px) wide, height up to roof apex.
    Heights from FFL: 0 floor, +2800 low eave (south), +4200 high eave (north), +600 podium below grade visible
  -->

  <!-- Sky -->
  <rect x="80" y="240" width="1440" height="540" fill="url(#sky)"/>

  <!-- Distant horizon line (ocean) -->
  <line x1="80" y1="640" x2="1520" y2="640" stroke="#7a8a8e" stroke-width="0.6"/>
  <text x="80" y="635" font-size="10" fill="#7a8a8e" letter-spacing="3">— ATLANTIC HORIZON —</text>

  <!-- Place house. Width on page: 700 px (5m at 140) — but east elevation shows depth (4m) = 560 px
       Centered at x=800, base at y=820 (FFL). -->
  <g transform="translate(500,820)">
    <!-- Grade line -->
    <line x1="-420" y1="0" x2="1020" y2="0" stroke="#101218" stroke-width="1.6"/>
    <!-- Ground hatching -->
    <g stroke="#5b5a55" stroke-width="0.5">
      <line x1="-420" y1="0" x2="-405" y2="14"/>
      <line x1="-380" y1="0" x2="-365" y2="14"/>
      <line x1="-340" y1="0" x2="-325" y2="14"/>
      <line x1="-300" y1="0" x2="-285" y2="14"/>
      <line x1="-260" y1="0" x2="-245" y2="14"/>
      <line x1="-220" y1="0" x2="-205" y2="14"/>
      <line x1="-180" y1="0" x2="-165" y2="14"/>
      <line x1="-140" y1="0" x2="-125" y2="14"/>
      <line x1="-100" y1="0" x2="-85" y2="14"/>
      <line x1="-60" y1="0" x2="-45" y2="14"/>
      <line x1="-20" y1="0" x2="-5" y2="14"/>
      <line x1="20" y1="0" x2="35" y2="14"/>

      <line x1="640" y1="0" x2="655" y2="14"/>
      <line x1="680" y1="0" x2="695" y2="14"/>
      <line x1="720" y1="0" x2="735" y2="14"/>
      <line x1="760" y1="0" x2="775" y2="14"/>
      <line x1="800" y1="0" x2="815" y2="14"/>
      <line x1="840" y1="0" x2="855" y2="14"/>
      <line x1="880" y1="0" x2="895" y2="14"/>
      <line x1="920" y1="0" x2="935" y2="14"/>
      <line x1="960" y1="0" x2="975" y2="14"/>
      <line x1="1000" y1="0" x2="1015" y2="14"/>
    </g>

    <!-- Cliff edge -->
    <path d="M -420 0 L -420 380 L -380 360 L -360 380 L -340 350 L -300 380 L -240 370 L -180 380 L -120 360 L -80 380 L -40 360 L 0 380 L 0 0 Z" fill="none"/>
    <path d="M 0 0 L 0 -560 L 60 -560 L 50 -580 L 30 -560 L 0 -560" fill="none"/>

    <!-- Concrete podium (-80mm above grade to +600mm above grade -> visible base 84 px tall, but elevation shows above ground)  -->
    <!-- Podium projects 800mm beyond house left (cliff side) and 200mm right -->
    <rect x="-112" y="-84" width="784" height="84" fill="url(#concretePod)" stroke="#101218" stroke-width="1.2"/>

    <!-- Main house volume. Floor: y=-84 (top of podium). Walls.
         South eave height: 2800 mm -> 392 px. North eave: 4200 mm -> 588 px.
         South wall at x = 0 (right of elev), North wall at x = -560 + 0... let me redo:
         East elevation depth 4000mm = 560 px. South is right side of east-elevation view (we're looking east, south on viewer's right). Or... orient north on left.
         Place north end at x=0 left, south end at x=560 right. Roof slopes high on north -> low on south.
         Top edge of wall: from (0, -84-588=-672) to (560, -84-392=-476). -->
    <!-- Cedar wall fill -->
    <polygon points="0,-672 560,-476 560,-84 0,-84" fill="url(#cedar)" stroke="#0a0a0a" stroke-width="1.6"/>
    <!-- Reveal joints horizontal (every 600mm = 84px) -->
    <g stroke="#2c2c2c" stroke-width="0.3">
      <line x1="0" y1="-588" x2="560" y2="-392"/>
      <line x1="0" y1="-504" x2="560" y2="-308"/>
      <line x1="0" y1="-420" x2="560" y2="-224"/>
      <line x1="0" y1="-336" x2="560" y2="-140"/>
      <line x1="0" y1="-252" x2="560" y2="-56"/>
    </g>

    <!-- Corten entry blade extending past wall (south side, right) -->
    <rect x="490" y="-292" width="22" height="292" fill="url(#cortenP)" stroke="#3C1809" stroke-width="0.8"/>
    <text x="540" y="-150" font-size="11" fill="#101218" letter-spacing="3">CORTEN  BLADE</text>
    <text x="540" y="-134" font-size="9" fill="#5b5a55" letter-spacing="2">6 mm plate · weathered</text>

    <!-- Window (full-height in north corner shown via slot at edge) -->
    <!-- East elevation shows side wall, so glazing on north face is hidden. Add 2 punched windows in east face. -->
    <rect x="60" y="-560" width="74" height="180" fill="#A9C2D1" stroke="#0a0a0a" stroke-width="1.2"/>
    <line x1="97" y1="-560" x2="97" y2="-380" stroke="#0a0a0a" stroke-width="0.7"/>
    <rect x="260" y="-380" width="120" height="220" fill="#A9C2D1" stroke="#0a0a0a" stroke-width="1.2"/>
    <line x1="320" y1="-380" x2="320" y2="-160" stroke="#0a0a0a" stroke-width="0.7"/>
    <line x1="260" y1="-270" x2="380" y2="-270" stroke="#0a0a0a" stroke-width="0.6"/>

    <!-- Sliding entry door slot on south end -->
    <rect x="412" y="-280" width="80" height="280" fill="#cccccc" stroke="#0a0a0a" stroke-width="1.3"/>
    <line x1="452" y1="-280" x2="452" y2="0" stroke="#0a0a0a" stroke-width="0.6"/>

    <!-- Roof — single pitch copper. Plane from (0,-672) to (560,-476). Extend 380mm overhang on north (cliff side) and 100mm south.
         Roof thickness 220mm -> 30 px. -->
    <polygon points="-54,-680 560,-468 560,-440 -54,-652" fill="url(#copperRoof)" stroke="#0a0a0a" stroke-width="1.4"/>
    <!-- Roof edge highlight -->
    <line x1="-54" y1="-680" x2="560" y2="-468" stroke="#FFD9B4" stroke-width="0.5" opacity="0.6"/>

    <!-- Gutter line on south eave -->
    <line x1="560" y1="-440" x2="568" y2="-422" stroke="#0a0a0a" stroke-width="0.6"/>

    <!-- Downspout -->
    <rect x="568" y="-422" width="6" height="422" fill="#3B1A0D"/>

    <!-- Chimney / flue for wood stove -->
    <rect x="180" y="-712" width="22" height="60" fill="#2a2a2a" stroke="#0a0a0a" stroke-width="0.8"/>
    <rect x="176" y="-718" width="30" height="8" fill="#2a2a2a" stroke="#0a0a0a" stroke-width="0.8"/>

    <!-- Vegetation foreground silhouettes -->
    <g fill="#3a4636" opacity="0.85">
      <!-- Sea-grape near cliff -->
      <path d="M -360 0 q -10 -50 30 -70 q 30 -10 40 18 q 10 -30 38 -10 q 30 20 10 62 z"/>
      <path d="M 680 0 q 16 -42 60 -42 q 36 0 36 42 z"/>
      <path d="M 820 0 q 12 -30 38 -30 q 26 0 26 30 z"/>
    </g>
    <!-- Agave -->
    <g stroke="#3a4636" stroke-width="1.6" fill="none">
      <line x1="930" y1="0" x2="900" y2="-40"/>
      <line x1="930" y1="0" x2="918" y2="-46"/>
      <line x1="930" y1="0" x2="938" y2="-48"/>
      <line x1="930" y1="0" x2="956" y2="-42"/>
      <line x1="930" y1="0" x2="966" y2="-30"/>
    </g>

    <!-- Human figure for scale (south side, near door) — 1.75m = 245 px tall -->
    <g transform="translate(620,0)">
      <circle cx="0" cy="-235" r="11" fill="#2a2a2a"/>
      <line x1="0" y1="-224" x2="0" y2="-130" stroke="#2a2a2a" stroke-width="9"/>
      <line x1="0" y1="-200" x2="-18" y2="-150" stroke="#2a2a2a" stroke-width="5"/>
      <line x1="0" y1="-200" x2="20" y2="-160" stroke="#2a2a2a" stroke-width="5"/>
      <line x1="0" y1="-130" x2="-12" y2="-2" stroke="#2a2a2a" stroke-width="6"/>
      <line x1="0" y1="-130" x2="14" y2="-2" stroke="#2a2a2a" stroke-width="6"/>
      <text x="34" y="-120" font-size="9" fill="#5b5a55" letter-spacing="2">1.75 m</text>
    </g>

    <!-- Level lines / dimensions on the right -->
    <g stroke="#101218" stroke-width="0.6" fill="#101218">
      <!-- Datum -->
      <line x1="1020" y1="0" x2="700" y2="0" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="1020" y1="-84" x2="700" y2="-84" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="1020" y1="-476" x2="700" y2="-476" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="1020" y1="-672" x2="700" y2="-672" stroke-dasharray="2 3" stroke-width="0.4"/>

      <text x="1024" y="3" font-size="10" letter-spacing="2">± 0.00  GRADE</text>
      <text x="1024" y="-81" font-size="10" letter-spacing="2">+ 0.60  FFL</text>
      <text x="1024" y="-473" font-size="10" letter-spacing="2">+ 3.40  EAVE S</text>
      <text x="1024" y="-669" font-size="10" letter-spacing="2">+ 4.80  EAVE N</text>
    </g>

    <!-- Horizontal dimension below grade -->
    <g stroke="#101218" stroke-width="0.7" fill="#101218">
      <line x1="0" y1="44" x2="560" y2="44" marker-start="url(#dim-tickE)" marker-end="url(#dim-tickE)"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke-dasharray="2 3" stroke-width="0.4"/>
      <line x1="560" y1="0" x2="560" y2="50" stroke-dasharray="2 3" stroke-width="0.4"/>
      <text x="280" y="62" font-size="13" text-anchor="middle" letter-spacing="2">4 000</text>
    </g>

    <!-- Annotations -->
    <g fill="#101218" font-size="10" letter-spacing="2">
      <text x="-40" y="-700">STANDING-SEAM COPPER ROOF · MONO-PITCH 18°</text>
      <text x="-40" y="-686" font-size="9" fill="#5b5a55">slope toward sea for rain water collection</text>

      <text x="160" y="-740">FLUE</text>

      <text x="40" y="-590" fill="#F5F2EB">CHARCOAL CEDAR · 1×4 SHIPLAP, BURN-TREATED</text>
      <text x="270" y="-300" fill="#0a0a0a">EAST FENESTRATION  ·  CLEAR LOW-E IGU</text>
    </g>
  </g>

  <!-- Drawing legend / notes bottom -->
  <g transform="translate(80,1000)">
    <text font-size="11" letter-spacing="2" fill="#101218">MATERIALS</text>
    <line x1="0" y1="6" x2="120" y2="6" stroke="#101218" stroke-width="0.5"/>

    <g transform="translate(0,28)">
      <rect width="36" height="14" fill="url(#cedar)" stroke="#0a0a0a" stroke-width="0.6"/>
      <text x="48" y="11" font-size="10" letter-spacing="1" fill="#101218">Charcoal cedar 1×4 shiplap, burn-finished</text>
    </g>
    <g transform="translate(0,52)">
      <rect width="36" height="14" fill="url(#copperRoof)" stroke="#0a0a0a" stroke-width="0.6"/>
      <text x="48" y="11" font-size="10" letter-spacing="1" fill="#101218">Patinated copper standing-seam roof</text>
    </g>
    <g transform="translate(0,76)">
      <rect width="36" height="14" fill="url(#concretePod)" stroke="#0a0a0a" stroke-width="0.6"/>
      <text x="48" y="11" font-size="10" letter-spacing="1" fill="#101218">Board-formed reinforced concrete podium</text>
    </g>
    <g transform="translate(0,100)">
      <rect width="36" height="14" fill="url(#cortenP)" stroke="#0a0a0a" stroke-width="0.6"/>
      <text x="48" y="11" font-size="10" letter-spacing="1" fill="#101218">Corten weathered steel entry blade · 6 mm plate</text>
    </g>
    <g transform="translate(0,124)">
      <rect width="36" height="14" fill="#A9C2D1" stroke="#0a0a0a" stroke-width="0.6"/>
      <text x="48" y="11" font-size="10" letter-spacing="1" fill="#101218">Low-iron clear glass · low-E IGU · hurricane-rated</text>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(1110,950)">
    <rect x="0" y="0" width="410" height="170" fill="none" stroke="#101218" stroke-width="1"/>
    <line x1="0" y1="34" x2="410" y2="34" stroke="#101218" stroke-width="0.6"/>
    <line x1="0" y1="100" x2="410" y2="100" stroke="#101218" stroke-width="0.6"/>
    <line x1="200" y1="34" x2="200" y2="170" stroke="#101218" stroke-width="0.6"/>
    <text x="14" y="22" font-size="14" letter-spacing="4" fill="#101218">ARCHNIMATIONS</text>
    <text x="14" y="56" font-size="10" letter-spacing="2" fill="#5b5a55">PROJECT</text>
    <text x="14" y="76" font-size="13" letter-spacing="2" fill="#101218">MAREA MICRO-HOUSE</text>
    <text x="14" y="90" font-size="10" letter-spacing="1" fill="#5b5a55">Las Galeras · Samaná</text>
    <text x="14" y="122" font-size="10" letter-spacing="2" fill="#5b5a55">DRAWING</text>
    <text x="14" y="138" font-size="12" letter-spacing="2" fill="#101218">A-201  EAST ELEVATION</text>
    <text x="14" y="154" font-size="9" letter-spacing="1" fill="#5b5a55">Scale 1:50  ·  Sheet 2 / 3</text>
    <text x="214" y="56" font-size="10" letter-spacing="2" fill="#5b5a55">DATE</text>
    <text x="214" y="74" font-size="11" letter-spacing="1" fill="#101218">2026 · 06</text>
    <text x="214" y="122" font-size="10" letter-spacing="2" fill="#5b5a55">VIEW</text>
    <text x="214" y="138" font-size="11" letter-spacing="1" fill="#101218">EAST — Atlantic-facing</text>
    <text x="214" y="154" font-size="9" letter-spacing="1" fill="#5b5a55">Section reference A / A-301</text>
  </g>
</svg>
